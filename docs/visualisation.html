/* ============================================================
 * 4. SHORT DIAGRAM / CHART ALIASES
 *    Legacy diagram.md and chart.jinja2 reference short names such as
 *    --surface, --on-surface, --chart-1..10, --primary, --r-full. These MUST
 *    resolve to the canonical --lumi-sys-color--* tokens (which flip in dark
 *    mode) — otherwise every diagram var() falls back to black (historical
 *    mass-regression bug #4). Light-hex fallbacks are a last resort only.
 * ============================================================ */
:root {
  /* surfaces */
  --surface: var(--lumi-sys-color--surface, #fdfcfc);
  --surface-dim: var(--lumi-sys-color--surface-dim, #f2f0f0);
  --surface-bright: var(--lumi-sys-color--surface-bright, #ffffff);
  --surface-container: var(--lumi-sys-color--surface-container, #f2f0f0);
  --surface-container-high: var(--lumi-sys-color--surface-container-high, #e6e6e6);
  --surface-container-lowest: var(--lumi-sys-color--surface, #ffffff);
  --surface-accent: var(--lumi-sys-color--surface-accent, #9dd2ff);
  --surface-translucent: var(--lumi-sys-color--surface-translucent, rgba(255, 255, 255, 0.88));
  --surface-glass: var(--lumi-sys-color--surface-translucent, rgba(255, 255, 255, 0.88));
  /* foreground */
  --on-surface: var(--lumi-sys-color--on-surface, #000000);
  --on-surface-variant: var(--lumi-sys-color--on-surface-variant, rgba(0, 0, 0, 0.62));
  --on-surface-low: var(--lumi-sys-color--on-surface-low, rgba(0, 0, 0, 0.08));
  /* accents / brand */
  --primary: var(--lumi-sys-color--primary, #3186ff);
  --primary-container: var(--lumi-sys-color--accent-container, #dcf1ff);
  --accent: var(--lumi-sys-color--accent, #9dd2ff);
  --accent-container: var(--lumi-sys-color--accent-container, #dcf1ff);
  --accent-fixed: var(--lumi-sys-color--accent-fixed, #3186ff);
  /* status */
  --positive: var(--lumi-sys-color--positive, #008052);
  --positive-container: var(--lumi-sys-color--positive-container, #daf9d4);
  --error: var(--lumi-sys-color--error, #de2d29);
  --error-container: var(--lumi-sys-color--error-container, #ffdeec);
  /* structure */
  --outline: var(--lumi-sys-color--outline, #727676);
  --stroke-default: var(--lumi-sys-color--stroke-default, #e3e3e3);
  /* chart series 1..10 */
  --chart-1: var(--lumi-sys-color--chart-series-1, #2575fc);
  --chart-2: var(--lumi-sys-color--chart-series-2, #5b6e9e);
  --chart-3: var(--lumi-sys-color--chart-series-3, #228a49);
  --chart-4: var(--lumi-sys-color--chart-series-4, #62991b);
  --chart-5: var(--lumi-sys-color--chart-series-5, #1e564d);
  --chart-6: var(--lumi-sys-color--chart-series-6, #526a45);
  --chart-7: var(--lumi-sys-color--chart-series-7, #2780c4);
  --chart-8: var(--lumi-sys-color--chart-series-8, #997112);
  --chart-9: var(--lumi-sys-color--chart-series-9, #705ec2);
  --chart-10: var(--lumi-sys-color--chart-series-10, #c84288);
  /* code palette */
  --code-background: var(--lumi-sys-color--code-background, #000000);
  --code-primary-text: var(--lumi-sys-color--code-primary-text, #ffffff);
  /* spacing shorthands */
  --spacing-xs: var(--lumi-sys-spacing--xs, 4px);
  --spacing-s: var(--lumi-sys-spacing--s, 8px);
  --spacing-m: var(--lumi-sys-spacing--m, 12px);
  --spacing-l: var(--lumi-sys-spacing--l, 16px);
  --spacing-xl: var(--lumi-sys-spacing--xl, 20px);
  /* radius shorthands */
  --r-container: var(--lumi-sys-shape--xl-max, 40px);
  --r-xl: var(--lumi-sys-shape--xl, 28px);
  --r-l: var(--lumi-sys-shape--large-max, 24px);
  --r-m: var(--lumi-sys-shape--large, 16px);
  --r-s: var(--lumi-sys-shape--small, 8px);
  --r-full: var(--lumi-sys-shape--full, 999px);
}

/* ============================================================
 * 5. IN-SCOPE PRE-BAKED COMPONENT CLASSES
 *    Interactive controls + simple display components only (Decision D5).
 *    Complex components (timeline, sequence, stepper, pros-cons, hero, HUD,
 *    hotspot, media grid) are intentionally excluded.
 * ============================================================ */

/* Global font rendering quality + transparent root backdrop.
 * Keep --body-bg transparent in both light and dark modes so inline widgets
 * blend into both desktop (#0f0f0f) and mobile / <960px (#000000) host
 * surfaces. Matching :root color-scheme rules prevent Chromium from painting an
 * opaque white canvas behind transparent dark-mode iframes (b/566242402). */
*, *::before, *::after {
  box-sizing: border-box;
}

html, body {
  background: var(--body-bg, transparent) !important;
  color: var(--on-surface) !important;
  /* Auto-resizing iframe: content grows the frame, never scrolls the document.
   * Model widgets already emit this; declared here as the SSoT default. */
  overflow-y: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-optical-sizing: auto;
  text-rendering: optimizeLegibility;
}

.widget-container {
  width: 100% !important;
  max-width: 100% !important;
  padding-inline: 0 !important;
  box-sizing: border-box;
}

/* ============================================================
 * SCROLLBAR DISCIPLINE (single source of truth)
 *   Long lists/cards flow and let the iframe auto-resize (see the C++
 *   NeutralizeInnerScroll pass, which removes accidental tiny scroll boxes).
 *   For LEGITIMATE overflow that remains (wide tables, code, pan-containers,
 *   large >=240px viewports) render a slim, theme-aware scrollbar.
 *   One token carries the correct light/dark contrast (the auto-flipped
 *   stroke token is too dark on #0f0f0f), referenced once = SSoT.
 * ============================================================ */
:root { --lumi-scrollbar-thumb: rgba(0, 0, 0, 0.20); }
:root[data-theme="dark"], body.dark-mode { --lumi-scrollbar-thumb: rgba(255, 255, 255, 0.20); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --lumi-scrollbar-thumb: rgba(255, 255, 255, 0.20); }
}
* {
  scrollbar-width: thin;
  scrollbar-color: var(--lumi-scrollbar-thumb) transparent;
}
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background-color: var(--lumi-scrollbar-thumb);
  border-radius: var(--lumi-sys-shape--full, 999px);
}

/* --- Buttons --- */
/* Universal button fallback (element specificity 0,0,1) — beats `* { padding: 0 }`
   author resets (0,0,0) while still yielding to any author class selector (0,1,0). */
button {
  appearance: none;
  -webkit-appearance: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--lumi-sys-spacing--xs, 6px);
  min-height: 36px;
  padding: 6px 16px;
  font-family: var(--ff-sans, 'Google Sans Flex', 'Google Sans', sans-serif);
  font-size: 13px;
  font-weight: 500;
  line-height: 18px;
  color: var(--on-surface, #000000);
  background-color: var(--surface-bright, #ffffff);
  border: 1px solid var(--stroke-default, #e3e3e3);
  border-radius: var(--lumi-sys-shape--full, 999px);
  cursor: pointer;
  user-select: none;
  box-sizing: border-box;
  transition: background-color 0.15s, color 0.15s, border-color 0.15s;
}
button:hover {
  background-color: var(--surface-container-high, #e6e6e6);
}
button.active, button.is-active, button.selected, button.is-selected, button[aria-pressed="true"], button[aria-selected="true"], button[aria-checked="true"] {
  background-color: var(--accent-container, #dcf1ff);
  color: var(--lumi-sys-color--on-surface-default, #000000);
  border-color: var(--lumi-sys-color--primary, #3186ff);
}

(function() {
  function syncBody() {
    var dt = document.documentElement.getAttribute('data-theme');
    if (document.body && (dt === 'dark' || dt === 'light')) {
      document.body.classList.toggle('dark-mode', dt === 'dark');
    }
  }
  function syncTheme(theme) {
    if (theme !== 'dark' && theme !== 'light') return;
    document.documentElement.setAttribute('data-theme', theme);
    syncBody();
  }
  if (typeof MutationObserver === 'function') {
    new MutationObserver(syncBody).observe(document.documentElement, {
      attributes: true, attributeFilter: ['data-theme']
    });
  }
  if (typeof document.addEventListener === 'function') {
    document.addEventListener('DOMContentLoaded', syncBody);
  }
  try {
    var mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
    if (mq) {
      var cur = document.documentElement.getAttribute('data-theme');
      if (!cur) {
        syncTheme(mq.matches ? 'dark' : 'light');
      } else {
        syncTheme(cur);
      }
      if (mq.addEventListener) {
        mq.addEventListener('change', function(e) {
          syncTheme(e.matches ? 'dark' : 'light');
        });
      }
    }
  } catch (e) {}
  window.addEventListener('message', function(e) {
    if (e.data && (e.data.type === 'set-theme' || e.data.type === 'APPLY_THEME') && e.data.theme) {

      </g>
      <g id="c-cell-10">
        <rect id="c10-rect" class="c-cell-rect" x="276" y="380" width="136" height="30" rx="15" fill="var(--surface-bright)" stroke="var(--stroke-default)" stroke-width="1"/>
        <text id="c10-text" x="344" y="400" text-anchor="middle" font-family="var(--ff-mono)" font-size="13" fill="var(--on-surface-variant)">c10 = —</text>
      </g>
      <g id="c-cell-11">
        <rect id="c11-rect" class="c-cell-rect" x="436" y="380" width="136" height="30" rx="15" fill="var(--surface-bright)" stroke="var(--stroke-default)" stroke-width="1"/>
        <text id="c11-text" x="504" y="400" text-anchor="middle" font-family="var(--ff-mono)" font-size="13" fill="var(--on-surface-variant)">c11 = —</text>

      <!-- Legend in Bottom-Left Empty Area -->
      <g transform="translate(24, 324)">
        <rect x="0" y="0" width="208" height="84" rx="16" fill="var(--surface-dim)"/>
        <circle cx="20" cy="22" r="7" fill="var(--accent-container)" stroke="var(--primary)" stroke-width="1.3"/>
        <text x="36" y="26" font-family="var(--ff-sans)" font-size="13" fill="var(--on-surface)">Input A token (L → R)</text>
        <circle cx="20" cy="44" r="7" fill="var(--surface-bright)" stroke="var(--chart-9)" stroke-width="1.3"/>
        <text x="36" y="48" font-family="var(--ff-sans)" font-size="13" fill="var(--on-surface)">Weight W token (load)</text>
        <circle cx="20" cy="66" r="7" fill="var(--surface-bright)" stroke="var(--chart-3)" stroke-width="1.3"/>
        <text x="36" y="70" font-family="var(--ff-sans)" font-size="13" fill="var(--on-surface)">Partial sum (T → B)</text>
      </g>

      <!-- Animated Sliding Tokens Layer -->
      <!-- Weight tokens (for Ticks 1-2) -->
      <g id="tok-w01" class="token-group" style="opacity:0;">
        <rect x="-22" y="-16" width="44" height="32" rx="16" fill="var(--surface-bright)" stroke="var(--chart-9)" stroke-width="1.5"/>
        <text id="tok-w01-txt" x="0" y="5" text-anchor="middle" font-family="var(--ff-mono)" font-size="13" fill="var(--on-surface)">6</text>
      </g>
      <g id="tok-w11" class="token-group" style="opacity:0;">
        <rect x="-22" y="-16" width="44" height="32" rx="16" fill="var(--surface-bright)" stroke="var(--chart-9)" stroke-width="1.5"/>
        <text id="tok-w11-txt" x="0" y="5" text-anchor="middle" font-family="var(--ff-mono)" font-size="13" fill="var(--on-surface)">8</text>
      </g>
      <g id="tok-w00" class="token-group" style="opacity:0;">
        <rect x="-22" y="-16" width="44" height="32" rx="16" fill="var(--surface-bright)" stroke="var(--chart-9)" stroke-width="1.5"/>
        <text id="tok-w00-txt" x="0" y="5" text-anchor="middle" font-family="var(--ff-mono)" font-size="13" fill="var(--on-surface)">5</text>
      </g>
      <g id="tok-w10" class="token-group" style="opacity:0;">
        <rect x="-22" y="-16" width="44" height="32" rx="16" fill="var(--surface-bright)" stroke="var(--chart-9)" stroke-width="1.5"/>
        <text id="tok-w10-txt" x="0" y="5" text-anchor="middle" font-family="var(--ff-mono)" font-size="13" fill="var(--on-surface)">7</text>
      </g>

      <!-- Skewed Input A tokens (for Ticks 3-6) -->
      <g id="tok-a00" class="token-group" style="opacity:0;">
        <circle cx="0" cy="0" r="18" fill="var(--accent-container)" stroke="var(--primary)" stroke-width="1.5"/>
        <text id="tok-a00-txt" x="0" y="5" text-anchor="middle" font-family="var(--ff-mono)" font-size="13" fill="var(--on-surface)">1</text>
      </g>
      <g id="tok-a10" class="token-group" style="opacity:0;">
        <circle cx="0" cy="0" r="18" fill="var(--accent-container)" stroke="var(--primary)" stroke-width="1.5"/>
        <text id="tok-a10-txt" x="0" y="5" text-anchor="middle" font-family="var(--ff-mono)" font-size="13" fill="var(--on-surface)">3</text>
      </g>
      <g id="tok-a01" class="token-group" style="opacity:0;">
        <circle cx="0" cy="0" r="18" fill="var(--accent-container)" stroke="var(--primary)" stroke-width="1.5"/>
        <text id="tok-a01-txt" x="0" y="5" text-anchor="middle" font-family="var(--ff-mono)" font-size="13" fill="var(--on-surface)">2</text>
      </g>
      <g id="tok-a11" class="token-group" style="opacity:0;">
        <circle cx="0" cy="0" r="18" fill="var(--accent-container)" stroke="var(--primary)" stroke-width="1.5"/>
        <text id="tok-a11-txt" x="0" y="5" text-anchor="middle" font-family="var(--ff-mono)" font-size="13" fill="var(--on-surface)">4</text>
      </g>
      <g id="tok-skew0" class="token-group" style="opacity:0;">
        <circle cx="0" cy="0" r="16" fill="var(--surface-bright)" stroke="var(--outline)" stroke-width="1.2" stroke-dasharray="3 2"/>
        <text x="0" y="5" text-anchor="middle" font-family="var(--ff-mono)" font-size="13" fill="var(--on-surface-variant)">0</text>
      </g>

      <!-- Downward Partial Sum / Output Drop Tokens -->
      <g id="tok-p-col0" class="token-group" style="opacity:0;">
        <rect x="-24" y="-12" width="48" height="24" rx="12" fill="var(--surface-bright)" stroke="var(--chart-3)" stroke-width="1.5"/>
        <text id="tok-p-col0-txt" x="0" y="4" text-anchor="middle" font-family="var(--ff-mono)" font-size="13" fill="var(--on-surface)">0</text>
      </g>
      <g id="tok-p-col1" class="token-group" style="opacity:0;">
        <rect x="-24" y="-12" width="48" height="24" rx="12" fill="var(--surface-bright)" stroke="var(--chart-3)" stroke-width="1.5"/>
        <text id="tok-p-col1-txt" x="0" y="4" text-anchor="middle" font-family="var(--ff-mono)" font-size="13" fill="var(--on-surface)">0</text>
      </g>
    </svg>
  </div>

  <!-- Control Deck -->
  <div class="control-deck">
    <div class="playback-row">
      <div class="btn-group" role="group" aria-label="Playback controls">
        <button type="button" class="lumi-btn lumi-btn--tonal lumi-btn--small" id="btn-reset">Reset</button>
        <button type="button" class="lumi-btn lumi-btn--tonal lumi-btn--small" id="btn-prev" aria-label="Step Back">Back</button>
        <button type="button" class="lumi-btn lumi-btn--accent lumi-btn--small" id="btn-play">Play</button>
        <button type="button" class="lumi-btn lumi-btn--tonal lumi-btn--small" id="btn-next" aria-label="Step Forward">Next</button>
      </div>
      <div class="scrubber-wrap">
        <label class="lumi-body-s" for="tick-slider" style="color:var(--on-surface-variant);">Tick</label>
        <input type="range" id="tick-slider" class="lumi-slider" min="0" max="6" step="1" value="0" style="--progress: 0%;" aria-label="Clock tick scrubber">
        <div id="tick-slider-val" class="lumi-slider-value" style="min-width:44px; height:36px;">0</div>
      </div>
    </div>

    <div class="matrices-row">
      <div class="matrix-editor">
        <div class="matrix-meta">
          <span class="lumi-body-m-emphasized">Matrix A</span>
          <span class="lumi-body-s" style="color:var(--on-surface-variant);">Integers 0–8</span>
        </div>
        <div class="matrix-grid" role="group" aria-label="Matrix A inputs">
          <input type="number" class="matrix-input" id="in-a00" min="0" max="8" value="1" aria-label="A row 0 col 0">
          <input type="number" class="matrix-input" id="in-a01" min="0" max="8" value="2" aria-label="A row 0 col 1">
          <input type="number" class="matrix-input" id="in-a10" min="0" max="8" value="3" aria-label="A row 1 col 0">
          <input type="number" class="matrix-input" id="in-a11" min="0" max="8" value="4" aria-label="A row 1 col 1">
        </div>
      </div>

      <div class="matrix-editor">
        <div class="matrix-meta">
          <span class="lumi-body-m-emphasized">Matrix W</span>
          <span class="lumi-body-s" style="color:var(--on-surface-variant);">Integers 0–15</span>
        </div>
        <div class="matrix-grid" role="group" aria-label="Matrix W inputs">
          <input type="number" class="matrix-input" id="in-w00" min="0" max="15" value="5" aria-label="W row 0 col 0">
          <input type="number" class="matrix-input" id="in-w01" min="0" max="15" value="6" aria-label="W row 0 col 1">
          <input type="number" class="matrix-input" id="in-w10" min="0" max="15" value="7" aria-label="W row 1 col 0">
          <input type="number" class="matrix-input" id="in-w11" min="0" max="15" value="8" aria-label="W row 1 col 1">
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const state = {
  tick: 0,
  A: [[1, 2], [3, 4]],
  W: [[5, 6], [7, 8]]
};

let playTimer = null;

function clampInt(val, min, max, fallback) {
  const n = Math.round(Number(val));
  if (!Number.isFinite(n)) return fallback;
  return Math.max(min, Math.min(max, n));
}

function setToken(id, x, y, visible, text) {
  const el = document.getElementById(id);
  if (!el) return;
  el.style.transform = `translate(${x}px, ${y}px)`;
  el.style.opacity = visible ? '1' : '0';
  if (text !== undefined) {
    const txt = document.getElementById(id + '-txt');
    if (txt) txt.textContent = String(text);
  }
}

function setPE(id, wVal, wLocked, active, opText, outText) {
  const rect = document.getElementById(id + '-rect');
  const wbg = document.getElementById(id + '-wbg');
  const wTxt = document.getElementById(id + '-w');
  const opTxt = document.getElementById(id + '-op');
  const outTxt = document.getElementById(id + '-out');

  rect.setAttribute('fill', active ? 'var(--accent-container)' : 'var(--surface-dim)');
  rect.setAttribute('stroke', active ? 'var(--primary)' : 'var(--stroke-default)');
  wbg.setAttribute('stroke', wLocked ? 'var(--chart-9)' : 'var(--outline)');
  if (wTxt) wTxt.textContent = wLocked ? `w=${wVal}` : 'w=0';
  if (opTxt) opTxt.textContent = opText;
  opTxt.setAttribute('fill', active ? 'var(--on-surface)' : 'var(--on-surface-variant)');
  if (outTxt) outTxt.textContent = outText;
  outTxt.setAttribute('fill', active ? 'var(--on-surface)' : 'var(--on-surface-variant)');
}

function setCellC(id, label, val, ready, justDropped) {
  const rect = document.getElementById(id + '-rect');
  const txt = document.getElementById(id + '-text');
  rect.setAttribute('fill', justDropped ? 'var(--accent-container)' : 'var(--surface-bright)');
  rect.setAttribute('stroke', justDropped ? 'var(--primary)' : (ready ? 'var(--outline)' : 'var(--stroke-default)'));
  if (txt) txt.textContent = ready ? `${label} = ${val}` : `${label} = —`;
  txt.setAttribute('fill', ready ? 'var(--on-surface)' : 'var(--on-surface-variant)');
}

function updateViz() {
  const t = state.tick;
  const [[a00, a01], [a10, a11]] = state.A;
  const [[w00, w01], [w10, w11]] = state.W;

  // Products and outputs
  const p00_t3 = a00 * w00;
  const p01_t4 = a00 * w01;
  const p00_t4 = a10 * w00;
  const c00 = p00_t3 + a01 * w10;
  const p01_t5 = a10 * w01;
  const c01 = p01_t4 + a01 * w11;
  const c10 = p00_t4 + a11 * w10;
  const c11 = p01_t5 + a11 * w11;

  // Status strip
  const phasePill = document.getElementById('phase-pill');
  const phaseText = document.getElementById('phase-text');
  const tickCounter = document.getElementById('tick-counter');
  const caption = document.getElementById('status-caption');

  if (tickCounter) tickCounter.textContent = `Tick ${t} / 6`;
  phasePill.classList.remove('is-load', 'is-compute');

  if (t === 0) {
    if (phaseText) phaseText.textContent = 'RESET';
    if (caption) caption.textContent = 'System reset: all stationary weights, input lanes, and partial sums are cleared to 0.';
  } else if (t === 1) {
    phasePill.classList.add('is-load');
    if (phaseText) phaseText.textContent = 'LOAD WEIGHTS (uio_in[0]=1)';
    if (caption) caption.textContent = `Right column W[:,1] (${w01}, ${w11}) slides into Column 0 PEs while W[:,0] (${w00}, ${w10}) waits in the left queue.`;
  } else if (t === 2) {
    phasePill.classList.add('is-load');
    if (phaseText) phaseText.textContent = 'LOAD WEIGHTS (uio_in[0]=1)';
    if (caption) caption.textContent = `W[:,1] shifts right and locks into Column 1; W[:,0] slides in and locks into Column 0.`;
  } else if (t === 3) {
    phasePill.classList.add('is-compute');
    if (phaseText) phaseText.textContent = 'COMPUTE (uio_in[0]=0)';
    if (caption) caption.textContent = `Skewed A enters: A[0][0]=${a00} enters pe_00, producing psum = ${a00}×${w00} = ${p00_t3}.`;
  } else if (t === 4) {
    phasePill.classList.add('is-compute');
    if (phaseText) phaseText.textContent = 'COMPUTE (uio_in[0]=0)';
    if (caption) caption.textContent = `A[0][1]=${a01} enters pe_10 and meets psum ${p00_t3} from pe_00, dropping c00 = ${c00} out Column 0.`;
  } else if (t === 5) {
    phasePill.classList.add('is-compute');
    if (phaseText) phaseText.textContent = 'COMPUTE (uio_in[0]=0)';
    if (caption) caption.textContent = `Wave sweeps across: c10 = ${c10} drops out Column 0 and c01 = ${c01} drops out Column 1.`;
  } else {
    phasePill.classList.add('is-compute');
    if (phaseText) phaseText.textContent = 'COMPUTE (uio_in[0]=0)';
    if (caption) caption.textContent = `Final wave: A[1][1]=${a11} meets psum ${p01_t5} at pe_11, dropping c11 = ${c11} out Column 1.`;
  }

  // Coordinates: Q3=56, Q2=124, Q1=192, Col0=344, Col1=504, Exit=624; Row0=96, Row1=216
  // Weight tokens (visible on ticks 1..2)
  if (t === 0) {
    setToken('tok-w01', 192, 96, false, w01);
    setToken('tok-w11', 192, 216, false, w11);
    setToken('tok-w00', 124, 96, false, w00);
    setToken('tok-w10', 124, 216, false, w10);
  } else if (t === 1) {
    setToken('tok-w01', 344, 96, true, w01);
    setToken('tok-w11', 344, 216, true, w11);
    setToken('tok-w00', 192, 96, true, w00);
    setToken('tok-w10', 192, 216, true, w10);
  } else if (t === 2) {
    setToken('tok-w01', 504, 96, true, w01);
    setToken('tok-w11', 504, 216, true, w11);
    setToken('tok-w00', 344, 96, true, w00);
    setToken('tok-w10', 344, 216, true, w10);
  } else {
    setToken('tok-w01', 504, 96, false, w01);
    setToken('tok-w11', 504, 216, false, w11);
    setToken('tok-w00', 344, 96, false, w00);
    setToken('tok-w10', 344, 216, false, w10);
  }

  // Skewed Input A tokens (visible on ticks 3..6)
  if (t < 3) {
    setToken('tok-a00', 192, 96, false, a00);
    setToken('tok-a10', 124, 96, false, a10);
    setToken('tok-skew0', 192, 216, false);
    setToken('tok-a01', 124, 216, false, a01);
    setToken('tok-a11', 56, 216, false, a11);
  } else if (t === 3) {
    setToken('tok-a00', 298, 96, true, a00);
    setToken('tok-a10', 192, 96, true, a10);
    setToken('tok-skew0', 192, 216, true);
    setToken('tok-a01', 124, 216, true, a01);
    setToken('tok-a11', 56, 216, true, a11);
  } else if (t === 4) {
    setToken('tok-a00', 458, 96, true, a00);
    setToken('tok-a10', 298, 96, true, a10);
    setToken('tok-skew0', 298, 216, false);
    setToken('tok-a01', 298, 216, true, a01);
    setToken('tok-a11', 192, 216, true, a11);
  } else if (t === 5) {
    setToken('tok-a00', 620, 96, true, a00);
    setToken('tok-a10', 458, 96, true, a10);
    setToken('tok-skew0', 458, 216, false);
    setToken('tok-a01', 458, 216, true, a01);
    setToken('tok-a11', 298, 216, true, a11);
  } else {
    setToken('tok-a00', 640, 96, false, a00);
    setToken('tok-a10', 620, 96, true, a10);
    setToken('tok-skew0', 620, 216, false);
    setToken('tok-a01', 620, 216, true, a01);
    setToken('tok-a11', 458, 216, true, a11);
  }

  // Vertical partial sum drop tokens
  if (t === 3) {
    setToken('tok-p-col0', 344, 156, true, p00_t3);
    setToken('tok-p-col1', 504, 156, false, 0);
  } else if (t === 4) {
    setToken('tok-p-col0', 344, 286, true, c00);
    setToken('tok-p-col1', 504, 156, true, p01_t4);
  } else if (t === 5) {
    setToken('tok-p-col0', 344, 286, true, c10);
    setToken('tok-p-col1', 504, 286, true, c01);
  } else if (t === 6) {
    setToken('tok-p-col0', 344, 286, false, c10);
    setToken('tok-p-col1', 504, 286, true, c11);
  } else {
    setToken('tok-p-col0', 344, 156, false, 0);
    setToken('tok-p-col1', 504, 156, false, 0);
  }

  // PE States
  if (t === 0) {
    setPE('pe-00', 0, false, false, 'idle', '');
    setPE('pe-01', 0, false, false, 'idle', '');
    setPE('pe-10', 0, false, false, 'idle', '');
    setPE('pe-11', 0, false, false, 'idle', '');
  } else if (t === 1) {
    setPE('pe-00', w01, true, true, 'shift in', '');
    setPE('pe-01', 0, false, false, 'waiting', '');
    setPE('pe-10', w11, true, true, 'shift in', '');
    setPE('pe-11', 0, false, false, 'waiting', '');
  } else if (t === 2) {
    setPE('pe-00', w00, true, true, 'locked', '');
    setPE('pe-01', w01, true, true, 'locked', '');
    setPE('pe-10', w10, true, true, 'locked', '');
    setPE('pe-11', w11, true, true, 'locked', '');
  } else if (t === 3) {
    setPE('pe-00', w00, true, true, `${a00}×${w00} + 0`, `↓ ${p00_t3}`);
    setPE('pe-01', w01, true, false, 'idle', '');
    setPE('pe-10', w10, true, false, 'idle', '');
    setPE('pe-11', w11, true, false, 'idle', '');
  } else if (t === 4) {
    setPE('pe-00', w00, true, true, `${a10}×${w00} + 0`, `↓ ${p00_t4}`);
    setPE('pe-01', w01, true, true, `${a00}×${w01} + 0`, `↓ ${p01_t4}`);
    setPE('pe-10', w10, true, true, `${a01}×${w10} + ${p00_t3}`, `↓ c00=${c00}`);
    setPE('pe-11', w11, true, false, 'idle', '');
  } else if (t === 5) {
    setPE('pe-00', w00, true, false, 'idle', '');
    setPE('pe-01', w01, true, true, `${a10}×${w01} + 0`, `↓ ${p01_t5}`);
    setPE('pe-10', w10, true, true, `${a11}×${w10} + ${p00_t4}`, `↓ c10=${c10}`);
    setPE('pe-11', w11, true, true, `${a01}×${w11} + ${p01_t4}`, `↓ c01=${c01}`);
  } else {
    setPE('pe-00', w00, true, false, 'idle', '');
    setPE('pe-01', w01, true, false, 'idle', '');
    setPE('pe-10', w10, true, false, 'idle', '');
    setPE('pe-11', w11, true, true, `${a11}×${w11} + ${p01_t5}`, `↓ c11=${c11}`);
  }

  // Output Matrix C Cells
  setCellC('c00', 'c00', c00, t >= 4, t === 4);
  setCellC('c01', 'c01', c01, t >= 5, t === 5);
  setCellC('c10', 'c10', c10, t >= 5, t === 5);
  setCellC('c11', 'c11', c11, t >= 6, t === 6);

  // Sync playback buttons
  document.getElementById('btn-prev').disabled = t <= 0;
  document.getElementById('btn-next').disabled = t >= 6;
}

function syncControlsFromState() {
  const slider = document.getElementById('tick-slider');
  const valBadge = document.getElementById('tick-slider-val');
  slider.value = String(state.tick);
  slider.style.setProperty('--progress', (state.tick / 6 * 100) + '%');
  if (valBadge) valBadge.textContent = String(state.tick);

  document.getElementById('in-a00').value = state.A[0][0];
  document.getElementById('in-a01').value = state.A[0][1];
  document.getElementById('in-a10').value = state.A[1][0];
  document.getElementById('in-a11').value = state.A[1][1];
  document.getElementById('in-w00').value = state.W[0][0];
  document.getElementById('in-w01').value = state.W[0][1];
  document.getElementById('in-w10').value = state.W[1][0];
  document.getElementById('in-w11').value = state.W[1][1];
}

function stopPlay() {
  if (playTimer) {
    clearInterval(playTimer);
    playTimer = null;
  }
  document.getElementById('btn-play').textContent = 'Play';
}

function saveUserState() {
  if (window.pageVault?.save) {
    window.pageVault.save('viz.state', {
      tick: state.tick,
      A: state.A,
      W: state.W
    }).catch(() => {});
  }
}

function applySavedState(raw) {
  if (typeof raw === 'string') { try { raw = JSON.parse(raw); } catch (_) { return false; } }
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return false;
  if (Number.isFinite(Number(raw.tick))) state.tick = clampInt(raw.tick, 0, 6, 0);
  if (Array.isArray(raw.A) && raw.A.length === 2) {
    state.A = [
      [clampInt(raw.A[0]?.[0], 0, 8, 1), clampInt(raw.A[0]?.[1], 0, 8, 2)],
      [clampInt(raw.A[1]?.[0], 0, 8, 3), clampInt(raw.A[1]?.[1], 0, 8, 4)]
    ];
  }
  if (Array.isArray(raw.W) && raw.W.length === 2) {
    state.W = [

  state.tick = 0;
  syncControlsFromState();
  updateViz();
  saveUserState();
});

document.getElementById('btn-prev').addEventListener('click', () => {
  stopPlay();
  if (state.tick > 0) {
    state.tick -= 1;
    syncControlsFromState();
    updateViz();
    saveUserState();
  }
});

document.getElementById('btn-next').addEventListener('click', () => {
  stopPlay();
  if (state.tick < 6) {
    state.tick += 1;
    syncControlsFromState();
    updateViz();
    saveUserState();
  }
});

document.getElementById('btn-play').addEventListener('click', () => {
  if (playTimer) {
    stopPlay();

  if (state.tick >= 6) {
    state.tick = 0;
    syncControlsFromState();
    updateViz();
  }
  document.getElementById('btn-play').textContent = 'Pause';
  playTimer = setInterval(() => {
    if (state.tick < 6) {
      state.tick += 1;
      syncControlsFromState();
      updateViz();
    } else {
      stopPlay();
      saveUserState();
    }
  }, 1100);
});

  updateViz();
  saveUserState();

function syncSortableTables(){
  try{
    document.querySelectorAll('table').forEach(function(tbl){
      var hdrRow=tbl.querySelector('thead tr')||tbl.querySelector('tr');
      var ths=hdrRow?Array.from(hdrRow.querySelectorAll('th')):[];
      if(!ths.length)return;
      var explicitCount=ths.filter(isThExplicitlySortable).length;
      if(!explicitCount)return;
      var hasPerColHints=ths.some(function(th){
        return th.hasAttribute('onclick')||th.hasAttribute('data-sort')||th.hasAttribute('data-col')||th.hasAttribute('data-key')||th.matches('.sortable, .is-sortable');
      });
      ths.forEach(function(th,idx){
        var txt=(th.textContent||'').trim();
        if(!txt||th.matches('.no-sort, [data-sortable="false"]')||th.querySelector('input, select, textarea'))return;
        if(hasPerColHints&&!isThExplicitlySortable(th))return;
        var isAsc=/[▲▴↑]/.test(txt)||th.matches('.asc, .sort-asc, .is-asc, [data-order="asc"], [data-dir="asc"]');
        var isDesc=/[▼▾↓]/.test(txt)||th.matches('.desc, .sort-desc, .is-desc, [data-order="desc"], [data-dir="desc"]');
        var sortVal=isAsc?'ascending':(isDesc?'descending':'none');
        th.setAttribute('aria-sort',sortVal);
        var walker=document.createTreeWalker(th,NodeFilter.SHOW_TEXT,null,false);
        var tnodes=[];

          if(/[▲▼▴▾↑↓↕]/.test(tn.nodeValue)){
            var frag=document.createDocumentFragment();
            tn.nodeValue.split(/([▲▼▴▾↑↓↕]+)/).forEach(function(part){
              if(!part)return;
              if(/[▲▼▴▾↑↓↕]/.test(part)){
                var sp=document.createElement('span');
                sp.setAttribute('aria-hidden','true');
                sp.appendChild(document.createTextNode(part));
                frag.appendChild(sp);
              }else{
                frag.appendChild(document.createTextNode(part));
              }
            });

          }
        });
        var btn=th.querySelector('button');
        if(!btn){
          btn=document.createElement('button');
          btn.type='button';
          btn.className='lumi-sort-btn';
          btn.style.cssText='all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:4px;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;text-align:inherit;width:100%;justify-content:inherit;border-radius:4px;';
          for(var a=0;a<th.attributes.length;a++){
            var an=th.attributes[a].name;
            if(an.indexOf('data-')===0)btn.setAttribute(an,th.attributes[a].value);
          }
          while(th.childNodes.length)btn.appendChild(th.childNodes[0]);
          th.appendChild(btn);
        }
        if(!th.dataset.lumiSortBound){
          th.dataset.lumiSortBound='1';

            lastSortedTable=tbl;
            lastSortedColIndex=idx;
            setTimeout(function(){

                if(targetBtn&&document.activeElement!==targetBtn)targetBtn.focus();

            },0);
          });
        }
      });
    });
  }catch(e){}
}
function formatChartVal(v){
  if(v===null||v===undefined)return '';
  if(typeof v==='object'){
    if(v.label||v.name){
      var nm=v.label||v.name;
      if(v.x!==undefined&&v.y!==undefined)return [nm,'('+v.x+', '+v.y+')'].join(' ');
    }
    if(v.y!==undefined&&v.x!==undefined&&typeof v.x==='number')return '('+v.x+', '+v.y+')';
    if(v.y!==undefined)return String(v.y);
    return JSON.stringify(v);
  }
  return String(v);
}
function buildChartSteps(chart){
  var cfg=chart.config||{};
  var data=chart.data||cfg.data||{};
  var labels=Array.isArray(data.labels)?data.labels:[];
  var dsList=Array.isArray(data.datasets)?data.datasets:[];
  var type=(cfg.type||'').toString();
  var visDs=[];
  for(var d=0;d<dsList.length;d++){
    var meta=chart.getDatasetMeta?chart.getDatasetMeta(d):null;
    var hidden=(meta&&meta.hidden===true)||(dsList[d]&&dsList[d].hidden===true);
    if(!hidden&&dsList[d]&&Array.isArray(dsList[d].data)&&dsList[d].data.length){
      visDs.push(d);
    }
  }
  if(!visDs.length)return[];
  var steps=[];
  if(type==='scatter'||type==='bubble'||!labels.length){
    var maxLen=0;
    visDs.forEach(function(d){if(dsList[d].data.length>maxLen)maxLen=dsList[d].data.length;});
    if(type==='scatter'||type==='bubble'){
      visDs.forEach(function(d){
        var arr=dsList[d].data;
        for(var i=0;i<arr.length;i++){
          if(arr[i]!==null&&arr[i]!==undefined)steps.push([{datasetIndex:d,index:i}]);
        }
      });
    }else{
      for(var idx=0;idx<maxLen;idx++){
        var els=[];
        visDs.forEach(function(d){
          if(idx<dsList[d].data.length&&dsList[d].data[idx]!==null&&dsList[d].data[idx]!==undefined){
            els.push({datasetIndex:d,index:idx});
          }
        });
        if(els.length)steps.push(els);
      }
    }
  }else{
    for(var c=0;c<labels.length;c++){
      var cEls=[];
      visDs.forEach(function(d){
        if(c<dsList[d].data.length&&dsList[d].data[c]!==null&&dsList[d].data[c]!==undefined){
          cEls.push({datasetIndex:d,index:c});
        }
      });
      if(cEls.length)steps.push(cEls);
    }
  }
  return steps;
}
function activateChartStep(chart,stepEls,stepIdx,totalSteps){
  var cv=chart&&chart['can'+'vas'];
  if(!stepEls||!stepEls.length)return;
  var pos={x:0,y:0};
  try{
    var fEl=stepEls[0];
    var meta=chart.getDatasetMeta?chart.getDatasetMeta(fEl.datasetIndex):null;
    var el=meta&&meta.data&&meta.data[fEl.index];
    if(el&&typeof el.tooltipPosition==='function')pos=el.tooltipPosition();
    else if(el&&el.x!==undefined&&el.y!==undefined)pos={x:el.x,y:el.y};
  }catch(e){}
  if(chart.setActiveElements)chart.setActiveElements(stepEls);
  if(chart.tooltip&&chart.tooltip.setActiveElements)chart.tooltip.setActiveElements(stepEls,pos);
  if(chart.update)chart.update('none');
  var msg='';
  try{
    var tt=chart.tooltip;
    if(tt&&Array.isArray(tt.body)&&tt.body.length){
      var tTitle=Array.isArray(tt.title)?tt.title.join(' '):'';
      var tLines=[];
      tt.body.forEach(function(b){
        if(b&&Array.isArray(b.lines))b.lines.forEach(function(l){if(l)tLines.push(l);});
      });

    var parts=stepEls.map(function(item){

        else if(ev.key==='ArrowLeft'||ev.key==='ArrowUp')stepCursor=stepCursor<=0?(steps.length-1):(stepCursor-1);
        else if(ev.key==='Home')stepCursor=0;

          if(chart.tooltip&&chart.tooltip.setActiveElements)chart.tooltip.setActiveElements([],{x:0,y:0});
          if(chart.update)chart.update('none');

function hookSvgCharts(){
